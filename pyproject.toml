[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coffee-driven-development"
version = "0.1.0"
description = "A deliberately over-serious coffee tracking CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "langgraph>=1.2.11,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
]

[project.scripts]
cdd = "cdd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """-ra
--basetemp=.pytest-tmp
--cov=cdd
--cov-branch
--cov-report=term-missing
--cov-report=xml:reports/coverage.xml
--cov-report=json:reports/coverage.json
--cov-report=html:reports/coverage-html
--cov-fail-under=90
"""

[tool.coverage.run]
branch = true
source = ["cdd"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.json]
output = "reports/coverage.json"

[tool.coverage.html]
directory = "reports/coverage-html"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
