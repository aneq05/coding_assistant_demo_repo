[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coffee-driven-development"
version = "0.1.0"
description = "A deliberately over-serious coffee tracking CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
cdd = "cdd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
